<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>C · 贴近输入 · 口播原型</title>
    <style>
      :root { color-scheme:dark; --bg:#0b0d11; --panel:#151920; --text:#f4f6fb; --muted:#929bab; --faint:#697180; --line:rgba(255,255,255,.1); --accent:#a8ed62; --accent-ink:#17200f; --danger:#ff9d91; }
      html[data-theme="light"] { color-scheme:light; --bg:#f4f5f0; --panel:#fff; --text:#1a2118; --muted:#687064; --faint:#8b9388; --line:rgba(20,34,14,.12); --accent:#6cae2b; --accent-ink:#fff; --danger:#bd493e; }
      * { box-sizing:border-box; }
      body { min-width:320px; min-height:100dvh; margin:0; background:var(--bg); color:var(--text); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
      button,textarea { font:inherit; }
      button { -webkit-tap-highlight-color:transparent; }
      .shell { min-height:100dvh; padding:18px 16px; }
      header { display:flex; align-items:center; justify-content:space-between; height:36px; }
      .brand { font-size:16px; font-weight:800; letter-spacing:-.04em; }
      .theme { width:34px; height:34px; border:1px solid var(--line); border-radius:11px; background:transparent; color:var(--muted); cursor:pointer; }
      .capture { display:flex; min-height:calc(100dvh - 86px); align-items:stretch; padding-top:34px; }
      .input-box { position:relative; display:flex; width:100%; min-height:56dvh; flex-direction:column; padding:22px 22px 78px; border:1px solid var(--line); border-radius:22px; background:var(--panel); }
      textarea { width:100%; min-height:35dvh; flex:1; resize:none; border:0; outline:0; background:transparent; color:var(--text); font-size:clamp(21px,5.8vw,32px); line-height:1.5; letter-spacing:-.04em; }
      textarea::placeholder { color:var(--faint); }
      .send { position:absolute; right:18px; bottom:18px; display:grid; width:50px; height:50px; place-items:center; border:0; border-radius:16px; background:var(--accent); color:var(--accent-ink); cursor:pointer; font-size:22px; font-weight:900; }
      .send:disabled { cursor:not-allowed; opacity:.32; }
      .toast { position:fixed; z-index:10; top:18px; left:50%; max-width:calc(100% - 32px); padding:10px 13px; transform:translate(-50%,-12px); border:1px solid var(--line); border-radius:12px; background:var(--panel); color:var(--text); font-size:12px; opacity:0; pointer-events:none; transition:opacity .16s,transform .16s; }
      .toast.show { transform:translate(-50%,0); opacity:1; }
      .toast.error { color:var(--danger); }
      .prototype-nav { position:fixed; z-index:7; right:50%; bottom:18px; display:flex; gap:3px; padding:4px; transform:translateX(50%); border:1px solid var(--line); border-radius:12px; background:color-mix(in srgb,var(--panel) 92%,transparent); box-shadow:0 8px 24px rgba(0,0,0,.2); backdrop-filter:blur(14px); }
      .prototype-nav a { min-width:28px; padding:6px 7px; border-radius:8px; color:var(--muted); font-size:10px; text-align:center; text-decoration:none; }
      .prototype-nav a.active { background:var(--accent); color:var(--accent-ink); font-weight:800; }
      .prototype-tools { width:min(100%,720px); margin:22px auto 0; color:var(--muted); font-size:11px; }
      .prototype-tools summary { cursor:pointer; color:var(--faint); }
      .tools-body { display:grid; gap:10px; margin-top:10px; padding:12px; border:1px dashed var(--line); border-radius:12px; }
      .tools-body label { display:flex; align-items:center; justify-content:space-between; gap:12px; }
      .tools-body button { width:max-content; padding:7px 9px; border:1px solid var(--line); border-radius:9px; background:transparent; color:var(--muted); cursor:pointer; font-size:11px; }
      .tools-body pre { max-height:180px; margin:0; overflow:auto; color:var(--faint); font:10px/1.5 ui-monospace,monospace; white-space:pre-wrap; }
      @media (min-width:700px) { .shell { width:min(100%,760px); margin:auto; padding-right:28px; padding-left:28px; } .prototype-nav { right:24px; bottom:24px; transform:none; } }
    </style>
  </head>
  <body>
    <div class="shell">
      <header><div class="brand">口播</div><button class="theme" id="theme" type="button" aria-label="切换主题">☼</button></header>
      <main class="capture"><div class="input-box"><textarea id="draft" autofocus placeholder="说就行…" aria-label="口播内容"></textarea><button class="send" id="send" type="button" aria-label="送进收件箱" disabled>↑</button></div></main>
      <details class="prototype-tools">
        <summary>原型测试</summary>
        <div class="tools-body">
          <label>下次提交强制失败 <input id="forceFailure" type="checkbox" /></label>
          <button id="clearMock" type="button">清空本地 mock</button>
          <pre id="state"></pre>
        </div>
      </details>
    </div>
    <nav class="prototype-nav" aria-label="切换原型"><a href="index.html">A</a><a href="b.html">B</a><a class="active" href="c.html">C</a></nav>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script>
      const prefix = "prototype-capture";
      const draft = document.querySelector("#draft");
      const sendButton = document.querySelector("#send");
      const toast = document.querySelector("#toast");
      const stateOutput = document.querySelector("#state");
      const forceFailure = document.querySelector("#forceFailure");
      let toastTimer;
      const state = { draft: localStorage.getItem(`${prefix}:draft`) || "", forceFailure: false, lastResult: "等待提交" };
      draft.value = state.draft;

      function todayKey() { return new Intl.DateTimeFormat("sv-SE").format(new Date()); }
      function entries() { return JSON.parse(localStorage.getItem(`${prefix}:entries:${todayKey()}`) || "[]"); }
      function saveEntry(text) { const list = entries(); list.push({ id: crypto.randomUUID(), text, createdAt: new Date().toISOString() }); localStorage.setItem(`${prefix}:entries:${todayKey()}`, JSON.stringify(list)); }
      function renderState() { stateOutput.textContent = JSON.stringify({ variant:"C · 贴近输入", draft:state.draft, forceFailureNextSubmit:state.forceFailure, lastResult:state.lastResult }, null, 2); }
      function showToast(message, error = false) { window.clearTimeout(toastTimer); toast.textContent = message; toast.classList.toggle("error", error); toast.classList.add("show"); toastTimer = window.setTimeout(() => toast.classList.remove("show"), 2200); }
      function sync() { state.draft = draft.value; localStorage.setItem(`${prefix}:draft`, state.draft); sendButton.disabled = state.draft.trim().length === 0; renderState(); }
      function send() {
        if (!state.draft.trim()) return;
        if (state.forceFailure) { state.forceFailure = false; forceFailure.checked = false; state.lastResult = "失败：正文保留"; showToast("暂时没送进去，正文还在", true); renderState(); draft.focus(); return; }
        saveEntry(state.draft.trim()); state.draft = ""; draft.value = ""; localStorage.setItem(`${prefix}:draft`, ""); state.lastResult = "成功：已投递并回焦"; showToast("已投递"); sync(); draft.focus();
      }
      draft.addEventListener("input", sync);
      draft.addEventListener("keydown", (event) => { if ((event.metaKey || event.ctrlKey) && event.key === "Enter") send(); });
      sendButton.addEventListener("click", send);
      forceFailure.addEventListener("change", (event) => { state.forceFailure = event.target.checked; renderState(); });
      document.querySelector("#theme").addEventListener("click", () => { const theme = document.documentElement.dataset.theme === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = theme; localStorage.setItem(`${prefix}:theme`, theme); });
      document.querySelector("#clearMock").addEventListener("click", () => { localStorage.removeItem(`${prefix}:draft`); Object.keys(localStorage).filter((key) => key.startsWith(`${prefix}:entries:`)).forEach((key) => localStorage.removeItem(key)); draft.value = ""; state.lastResult = "mock 已清空"; sync(); showToast("mock 已清空"); });
      document.documentElement.dataset.theme = localStorage.getItem(`${prefix}:theme`) || "dark";
      sync();
      draft.focus();
    </script>
  </body>
</html>
